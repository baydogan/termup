name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run also compiles the linter; later runs hit setup-go's cache.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # -race matters here: the scheduler, the async notifier and the trackers
      # are all touched from the concurrent probe pool.
      - name: test
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      # Run after the tests so a style finding cannot hide a failing test. Pinned
      # and run through the Go toolchain rather than an action, so CI and local
      # runs are literally the same command; setup-go's cache keeps the rebuild
      # off the critical path after the first run.
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2 run ./...

      - name: coverage
        run: |
          go tool cover -func=coverage.out | tail -1
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
